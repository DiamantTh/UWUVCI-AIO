# UWUVCI Tool Manifest
# Only genuinely external, cross-platform tools belong here.
# Windows-only tools (N64Converter, retroinject, psb, MArchiveBatchTool,
# BuildPcePkg, BuildTurboCDPcePkg) have been replaced by native C# implementations
# in UWUVCI.Services and are no longer downloaded as external binaries.
#
# sha256: fill in after verifying the binary yourself.
#         ToolDownloadService will refuse to download entries without sha256.
# download_url: leave empty for tools that must be installed manually.

# ── Cross-platform tools ────────────────────────────────────────────────────

[[tools]]
name         = "wit"
windows_file = "wit.exe"
linux_file   = "wit"
windows_only = false
sha256       = ""
download_url = ""
# Source: https://wit.wiimm.de/  (Wiimm's ISO Tools)

