# UWUVCI Tool Manifest
# sha256: leave empty until you have verified the binary yourself.
#         ToolDownloadService will refuse to download entries without sha256.
# download_url: leave empty for tools that must be installed manually.
#
# windows_only = true  → no linux_file; on Linux the feature is disabled
#                         unless Wine is present and manually configured.
# windows_only = false → native binary on both platforms.

# ── Cross-platform tools ────────────────────────────────────────────────────

[[tools]]
name         = "wit"
windows_file = "wit.exe"
linux_file   = "wit"
windows_only = false
sha256       = ""
download_url = ""
# Source: https://wit.wiimm.de/  (Wiimm's ISO Tools)

[[tools]]
name         = "nfs2iso2nfs"
windows_file = "nfs2iso2nfs.exe"
linux_file   = "nfs2iso2nfs"
windows_only = false
sha256       = ""
download_url = ""
# Source: https://gbatemp.net/threads/nfs2iso2nfs.415071/

[[tools]]
